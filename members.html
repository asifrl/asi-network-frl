<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members | ASI Network FRL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
height:72px;
padding:0 6%;
display:flex;
justify-content:space-between;
align-items:center;
background:#080808;
border-bottom:1px solid #222;
}

.logo{
font-weight:900;
letter-spacing:2px;
}

nav{
display:flex;
align-items:center;
gap:20px;
}

nav a,
nav button{
color:#aaa;
background:none;
border:0;
text-decoration:none;
cursor:pointer;
font-size:12px;
font-weight:800;
}

.hero{
padding:65px 6% 35px;
}

.eyebrow{
font-size:11px;
letter-spacing:3px;
font-weight:900;
color:#888;
}

h1{
font-size:clamp(38px,6vw,72px);
margin:10px 0;
}

.hero p{
color:#aaa;
max-width:700px;
line-height:1.7;
}

.content{
padding:20px 6% 80px;
}

.section-title{
font-size:24px;
margin-bottom:25px;
}

.episodes{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:24px;
}

.episode-card{
background:#111;
border:1px solid #222;
overflow:hidden;
}

.thumbnail{
width:100%;
aspect-ratio:16/9;
background:#1a1a1a;
display:flex;
align-items:center;
justify-content:center;
color:#666;
overflow:hidden;
}

.thumbnail img{
width:100%;
height:100%;
object-fit:cover;
}

.episode-info{
padding:20px;
}

.episode-number{
color:#888;
font-size:11px;
letter-spacing:2px;
font-weight:900;
}

.episode-title{
font-size:20px;
margin:8px 0;
}

.episode-description{
color:#999;
font-size:14px;
line-height:1.5;
min-height:42px;
}

.watch-button{
display:inline-block;
margin-top:15px;
padding:12px 18px;
background:white;
color:black;
text-decoration:none;
font-size:12px;
font-weight:900;
}

#status{
padding:25px 0;
color:#aaa;
}

.locked{
max-width:600px;
background:#111;
border:1px solid #222;
padding:30px;
}

.subscribe-button{
display:inline-block;
margin-top:15px;
padding:13px 20px;
background:white;
color:black;
text-decoration:none;
font-weight:900;
font-size:12px;
}

</style>
</head>

<body>

<header>

<div class="logo">
ASI NETWORK FRL
</div>

<nav>
<a href="/">HOME</a>
<button id="logout-button">LOG OUT</button>
</nav>

</header>

<section class="hero">

<div class="eyebrow">
ASI NETWORK FRL ORIGINAL
</div>

<h1>
Family Behind The Trauma
</h1>

<p>
An unfiltered family reality series revealing real life,
real relationships, and the stories behind the trauma.
</p>

</section>

<section class="content">

<h2 class="section-title">
Season 1
</h2>

<div id="status">
Checking your membership...
</div>

<div
id="episodes"
class="episodes"
></div>

</section>

<script>

const ASI_SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";

const ASI_SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";

const asiSupabase =
supabase.createClient(
ASI_SUPABASE_URL,
ASI_SUPABASE_PUBLISHABLE_KEY
);

const LINK_SUBSCRIPTION_FUNCTION =
ASI_SUPABASE_URL +
"/functions/v1/asi-link-subscription";


async function loadMembers(){

const status =
document.getElementById("status");

const episodesContainer =
document.getElementById("episodes");

try{

/* CHECK LOGIN */

const {
data:{
session
}
} =
await asiSupabase.auth.getSession();

if(!session){

window.location.href =
"/login.html";

return;
}


/* CHECK ACTIVE SUBSCRIPTION */

status.textContent =
"Verifying your ASI Network FRL membership...";

const subscriptionResponse =
await fetch(
LINK_SUBSCRIPTION_FUNCTION,
{
method:"POST",

headers:{
"Authorization":
"Bearer " +
session.access_token,

"apikey":
ASI_SUPABASE_PUBLISHABLE_KEY,

"Content-Type":
"application/json"
}
}
);

const subscriptionResult =
await subscriptionResponse.json();


if(
!subscriptionResponse.ok ||
subscriptionResult.active !== true
){

status.innerHTML =
`
<div class="locked">

<h2>
Subscription Required
</h2>

<p>
Your ASI Network FRL membership
is not currently active.
</p>

<a
class="subscribe-button"
href="https://square.link/u/0l47AY8p"
>
SUBSCRIBE — $5.99/MONTH
</a>

</div>
`;

return;
}


/* LOAD PUBLISHED EPISODES */

status.textContent =
"Loading episodes...";

const {
data:episodes,
error
} =
await asiSupabase
.from("episodes")
.select(
"id,episode_number,title,description,thumbnail_url,is_published"
)
.eq(
"is_published",
true
)
.order(
"episode_number",
{
ascending:true
}
);


if(error){

throw error;

}


if(
!episodes ||
episodes.length === 0
){

status.textContent =
"No episodes have been published yet.";

return;
}


status.style.display =
"none";


/* BUILD EPISODE CARDS */

episodesContainer.innerHTML =
episodes.map(
episode => {

const title =
episode.title ||
`Episode ${episode.episode_number}`;

const description =
episode.description ||
"ASI Network FRL Original";

const thumbnail =
episode.thumbnail_url
?
`
<img
src="${episode.thumbnail_url}"
alt="${title}"
>
`
:
`
<span>
ASI NETWORK FRL
</span>
`;


return `
<article class="episode-card">

<div class="thumbnail">
${thumbnail}
</div>

<div class="episode-info">

<div class="episode-number">
EPISODE ${episode.episode_number}
</div>

<h3 class="episode-title">
${title}
</h3>

<div class="episode-description">
${description}
</div>

<a
class="watch-button"
href="/watch.html?episode=${episode.episode_number}"
>
WATCH NOW
</a>

</div>

</article>
`;

}
).join("");


}catch(error){

console.error(error);

status.innerHTML =
`
We couldn't load your episodes.
<br><br>
${error.message}
`;

}

}


/* LOG OUT */

document
.getElementById("logout-button")
.addEventListener(
"click",
async () => {

await asiSupabase.auth.signOut();

window.location.href =
"/login.html";

}
);


window.addEventListener(
"DOMContentLoaded",
loadMembers
);

</script>

</body>
</html>
