<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sign In | ASI Network FRL</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
min-height:100vh;
display:grid;
place-items:center;
padding:20px;
background:
radial-gradient(circle at top,#262626,#090909 55%);
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

a{
color:inherit;
text-decoration:none;
}

button,
input{
font:inherit;
}

.box{
width:min(430px,100%);
padding:32px;
background:#111;
border:1px solid #333;
border-radius:10px;
box-shadow:0 20px 60px rgba(0,0,0,.45);
}

.eyebrow{
font-size:11px;
letter-spacing:3px;
font-weight:900;
color:#888;
margin-bottom:10px;
}

h1{
margin:0 0 10px;
font-size:34px;
}

.intro{
color:#999;
line-height:1.6;
margin-bottom:24px;
}

label{
display:block;
margin:14px 0 7px;
font-size:12px;
font-weight:900;
color:#aaa;
}

input{
width:100%;
padding:14px;
border-radius:6px;
border:1px solid #3a3a3a;
background:#080808;
color:#fff;
outline:none;
}

input:focus{
border-color:#888;
}

.actions{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-top:20px;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:44px;
padding:0 18px;
border-radius:6px;
border:1px solid #444;
background:#111;
color:#fff;
font-size:12px;
font-weight:900;
cursor:pointer;
}

.btn.primary{
background:#fff;
color:#000;
border-color:#fff;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

#forgotBox{
display:none;
margin-top:22px;
padding-top:20px;
border-top:1px solid #333;
}

#forgotBox p{
color:#999;
line-height:1.5;
font-size:13px;
}

#status{
display:none;
margin-top:18px;
padding:12px;
background:#181818;
border:1px solid #333;
border-radius:6px;
color:#ccc;
line-height:1.5;
}

.small-links{
display:flex;
justify-content:space-between;
gap:10px;
flex-wrap:wrap;
margin-top:22px;
font-size:12px;
color:#888;
}

.small-links a:hover{
color:#fff;
}

</style>
</head>


<body>

<div class="box">

<div class="eyebrow">
ASI NETWORK FRL
</div>

<h1>
Member Sign In
</h1>

<p class="intro">
Sign in to your ASI Network FRL account.
Your active subscription will be verified before member access is granted.
</p>


<label for="email">
Email Address
</label>

<input
id="email"
type="email"
autocomplete="email"
placeholder="Enter your email"
>


<label for="password">
Password
</label>

<input
id="password"
type="password"
autocomplete="current-password"
placeholder="Enter your password"
>


<div class="actions">

<button
id="loginButton"
class="btn primary"
>
SIGN IN
</button>

<button
id="forgotButton"
class="btn"
type="button"
>
FORGOT PASSWORD?
</button>

</div>


<div id="forgotBox">

<p>
Enter your email address above and we'll send you a secure password reset link.
</p>

<button
id="sendResetButton"
class="btn primary"
type="button"
>
SEND RESET EMAIL
</button>

</div>


<div id="status"></div>


<div class="small-links">

<a href="/create-account.html">
Subscribe / Create Account
</a>

<a href="/">
Back Home
</a>

</div>

</div>


<script>

const SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";


const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const statusBox =
document.getElementById("status");


function showStatus(message){

statusBox.style.display =
"block";

statusBox.textContent =
message;

}


document
.getElementById("forgotButton")
.addEventListener(
"click",
function(){

document
.getElementById("forgotBox")
.style.display =
"block";

}
);


if(
new URLSearchParams(
window.location.search
).get("forgot") === "1"
){

document
.getElementById("forgotBox")
.style.display =
"block";

}


document
.getElementById("loginButton")
.addEventListener(
"click",
async function(){

const email =
document
.getElementById("email")
.value
.trim();


const password =
document
.getElementById("password")
.value;


if(!email || !password){

showStatus(
"Enter your email address and password."
);

return;

}


this.disabled =
true;

this.textContent =
"SIGNING IN...";


showStatus(
"Checking your account..."
);


try{

const loginResult =
await sb.auth.signInWithPassword({
email,
password
});


if(loginResult.error){

throw loginResult.error;

}


const session =
loginResult.data.session;


if(!session){

throw new Error(
"Unable to start your ASI Network FRL session."
);

}


/* CHECK ADMIN */

const adminResult =
await sb
.from("admins")
.select("user_id")
.eq(
"user_id",
session.user.id
)
.maybeSingle();


const isAdmin =
!adminResult.error &&
!!adminResult.data;


/* ADMIN CAN ENTER WITHOUT SUBSCRIBER CHECK */

if(isAdmin){

window.location.replace(
"/members.html"
);

return;

}


/* VERIFY ACTIVE SUBSCRIPTION */

const response =
await fetch(
`${SUPABASE_URL}/functions/v1/asi-link-subscription`,
{

method:"POST",

headers:{

"Content-Type":
"application/json",

"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_KEY

},

body:
JSON.stringify({})

}
);


let result = {};


try{

result =
await response.json();

}
catch(error){}


const status =
String(
result.status || ""
).toUpperCase();


const active =
response.ok &&
(
result.active === true ||
result.isActive === true ||
status === "ACTIVE"
);


if(!active){

await sb.auth.signOut();


showStatus(
"An active ASI Network FRL subscription is required."
);


this.disabled =
false;

this.textContent =
"SIGN IN";


return;

}


window.location.replace(
"/members.html"
);


}catch(error){

console.error(
"Login error:",
error
);


showStatus(
error.message ||
"Unable to sign in."
);


this.disabled =
false;

this.textContent =
"SIGN IN";

}

}
);


document
.getElementById("sendResetButton")
.addEventListener(
"click",
async function(){

const email =
document
.getElementById("email")
.value
.trim();


if(!email){

showStatus(
"Enter your email address first."
);

return;

}


this.disabled =
true;

this.textContent =
"SENDING...";


showStatus(
"Sending your reset email..."
);


try{

const result =
await sb.auth.resetPasswordForEmail(
email,
{

redirectTo:
window.location.origin +
"/reset.html"

}
);


if(result.error){

throw result.error;

}


showStatus(
"Reset email sent. Check your inbox and spam folder."
);


}catch(error){

console.error(
"Password reset error:",
error
);


showStatus(
error.message ||
"Unable to send reset email."
);

}


this.disabled =
false;

this.textContent =
"SEND RESET EMAIL";

}
);

</script>

</body>
</html>
