<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Show | ASI Network FRL</title>

<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

a{
color:inherit;
text-decoration:none;
}

header{
position:sticky;
top:0;
z-index:50;
min-height:72px;
padding:0 4%;
display:flex;
align-items:center;
gap:26px;
background:rgba(5,5,5,.97);
border-bottom:1px solid #222;
}

.logo{
font-weight:900;
letter-spacing:1px;
white-space:nowrap;
}

.logo span{
color:#999;
font-weight:500;
}

.nav{
display:flex;
gap:22px;
align-items:center;
flex:1;
}

.nav a{
font-size:12px;
font-weight:900;
}

.nav a:hover{
opacity:.7;
}

main{
width:min(1200px,92%);
margin:40px auto 80px;
}

.hero{
padding:60px 0 35px;
}

.eyebrow{
font-size:12px;
letter-spacing:4px;
color:#999;
font-weight:900;
}

.hero h1{
font-size:clamp(46px,7vw,82px);
line-height:.95;
margin:10px 0 18px;
}

.hero p{
max-width:760px;
color:#bbb;
line-height:1.65;
}

.section{
margin-top:45px;
}

.section-head{
margin-bottom:18px;
}

.section-head h2{
margin:0;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(250px,1fr));
gap:18px;
}

.card{
background:#101010;
border:1px solid #222;
border-radius:10px;
overflow:hidden;
}

.thumb{
aspect-ratio:16/9;
background:
linear-gradient(135deg,#242424,#090909);
background-size:cover;
background-position:center;
display:grid;
place-items:center;
font-size:36px;
}

.body{
padding:17px;
}

.meta{
font-size:11px;
color:#777;
margin-bottom:8px;
font-weight:900;
letter-spacing:.7px;
}

.body h3{
margin:0 0 8px;
font-size:20px;
}

.body p{
margin:0;
color:#999;
line-height:1.55;
font-size:13px;
}

.actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:16px;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:42px;
padding:0 18px;
border-radius:6px;
border:1px solid #444;
background:#111;
color:#fff;
font-size:12px;
font-weight:900;
}

.btn.primary{
background:#fff;
color:#000;
border-color:#fff;
}

.empty{
grid-column:1/-1;
padding:28px;
border:1px solid #222;
background:#0d0d0d;
color:#888;
border-radius:8px;
}

.loading{
min-height:75vh;
display:grid;
place-items:center;
color:#999;
font-weight:900;
letter-spacing:2px;
}

#app{
display:none;
}

footer{
padding:35px 4%;
border-top:1px solid #181818;
color:#666;
font-size:12px;
display:flex;
justify-content:space-between;
gap:15px;
flex-wrap:wrap;
}

@media(max-width:820px){

header{
flex-wrap:wrap;
padding-top:14px;
padding-bottom:14px;
}

.nav{
order:3;
width:100%;
overflow-x:auto;
}

.grid{
grid-template-columns:
repeat(2,minmax(0,1fr));
}

}

@media(max-width:520px){

.grid{
grid-template-columns:1fr;
}

.hero h1{
font-size:48px;
}

}

</style>
</head>


<body>

<div
id="loading"
class="loading"
>
LOADING SHOW...
</div>


<div id="app">

<header>

<a
class="logo"
href="/members.html"
>
ASI NETWORK <span>FRL</span> 👁️
</a>


<nav class="nav">

<a href="/members.html">
HOME
</a>

<a href="/shows.html">
SHOWS
</a>

<a href="/members.html#episodes">
EPISODES
</a>

</nav>

</header>


<main>

<section class="hero">

<div class="eyebrow">
ASI NETWORK FRL ORIGINAL
</div>

<h1 id="showTitle">
SHOW
</h1>

<p id="showDescription">
Loading show information...
</p>

</section>


<section class="section">

<div class="section-head">

<h2>
Episodes
</h2>

</div>


<div
id="episodeGrid"
class="grid"
>

<div class="empty">
Loading episodes...
</div>

</div>

</section>

</main>


<footer>

<div>
© 2026 ASI NETWORK FRL
</div>

<a href="mailto:support@asinetworkfrl.com">
support@asinetworkfrl.com
</a>

</footer>

</div>


<script>

const SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";


const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let session = null;


function escapeHtml(value){

return String(value ?? "")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


async function hasAccess(){

const sessionResult =
await sb.auth.getSession();


session =
sessionResult.data.session;


if(!session){

return false;

}


const adminResult =
await sb
.from("admins")
.select("user_id")
.eq(
"user_id",
session.user.id
)
.maybeSingle();


if(
!adminResult.error &&
adminResult.data
){

return true;

}


const response =
await fetch(
`${SUPABASE_URL}/functions/v1/asi-link-subscription`,
{

method:"POST",

headers:{

"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({})

}
);


let result = {};


try{

result =
await response.json();

}
catch(error){}


const status =
String(
result.status || ""
).toUpperCase();


return (

response.ok &&

(
result.active === true ||
result.isActive === true ||
status === "ACTIVE"
)

);

}


async function initialize(){

try{

const allowed =
await hasAccess();


if(!allowed){

window.location.replace(
"/login.html"
);

return;

}


const params =
new URLSearchParams(
window.location.search
);


const showId =
params.get("id");


if(!showId){

window.location.replace(
"/shows.html"
);

return;

}


const showResult =
await sb
.from("shows")
.select("*")
.eq(
"id",
showId
)
.maybeSingle();


if(
showResult.error ||
!showResult.data
){

window.location.replace(
"/shows.html"
);

return;

}


const show =
showResult.data;


document
.getElementById("showTitle")
.textContent =
show.title ||
"ASI Network FRL Original";


document
.getElementById("showDescription")
.textContent =
show.description ||
"ASI Network FRL Original";


document.title =
`${show.title || "Show"} | ASI Network FRL`;


const seasonResult =
await sb
.from("seasons")
.select(
"id,show_id,season_number,title,is_published"
)
.eq(
"show_id",
showId
)
.order(
"season_number",
{
ascending:true
}
);


const seasons =
seasonResult.data || [];


const seasonIds =
seasons.map(
season =>
season.id
);


let episodes = [];


if(seasonIds.length){

const episodeResult =
await sb
.from("episodes")
.select(
"id,season_id,episode_number,title,description,thumbnail_url,is_published,video_id"
)
.in(
"season_id",
seasonIds
)
.eq(
"is_published",
true
)
.order(
"episode_number",
{
ascending:true
}
);


episodes =
episodeResult.data || [];

}


renderEpisodes(
episodes,
seasons
);


document
.getElementById("loading")
.style.display =
"none";


document
.getElementById("app")
.style.display =
"block";


}catch(error){

console.error(
"Show page error:",
error
);


window.location.replace(
"/shows.html"
);

}

}


function renderEpisodes(
episodes,
seasons
){

const grid =
document.getElementById(
"episodeGrid"
);


if(!episodes.length){

grid.innerHTML =
`
<div class="empty">
Published episodes are coming soon.
</div>
`;

return;

}


grid.innerHTML =
episodes
.map(episode => {

const season =
seasons.find(
item =>
item.id ===
episode.season_id
);


const seasonNumber =
season?.season_number || 1;


const thumbnailStyle =
episode.thumbnail_url
?
`background-image:url('${escapeHtml(episode.thumbnail_url)}')`
:
"";


return `
<article class="card">

<div
class="thumb"
style="${thumbnailStyle}"
>
▶
</div>

<div class="body">

<div class="meta">
SEASON ${seasonNumber}
• EPISODE ${episode.episode_number}
</div>

<h3>
${escapeHtml(
episode.title ||
`Episode ${episode.episode_number}`
)}
</h3>

<p>
${escapeHtml(
episode.description ||
"ASI Network FRL Original"
)}
</p>

<div class="actions">

<a
class="btn primary"
href="/watch.html?episode=${episode.episode_number}"
>
WATCH EPISODE
</a>

</div>

</div>

</article>
`;

})
.join("");

}


initialize();

</script>

</body>
</html>
