<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Reset Password | ASI Network FRL</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .reset-card {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 30px;
      box-sizing: border-box;
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      color: #bbb;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #444;
      background: #181818;
      color: #fff;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
      color: #ddd;
    }
  </style>
</head>

<body>

  <div class="reset-card">
    <h1>ASI NETWORK FRL</h1>

    <p>Create your new password below.</p>

    <input
      id="new-password"
      type="password"
      placeholder="New Password"
    >

    <input
      id="confirm-password"
      type="password"
      placeholder="Confirm New Password"
    >

    <button onclick="updatePassword()">
      Update Password
    </button>

    <p id="status">Verifying your reset link...</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://gvvtwwrjfscaunczptpv.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";

    const asiSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const status = document.getElementById("status");

    asiSupabase.auth.onAuthStateChange((event) => {
      if (event === "PASSWORD_RECOVERY") {
        status.textContent =
          "Reset link verified. Enter your new password.";
      }
    });

    async function updatePassword() {
      const newPassword =
        document.getElementById("new-password").value;

      const confirmPassword =
        document.getElementById("confirm-password").value;

      if (!newPassword || !confirmPassword) {
        status.textContent =
          "Enter and confirm your new password.";
        return;
      }

      if (newPassword !== confirmPassword) {
        status.textContent =
          "Passwords do not match.";
        return;
      }

      if (newPassword.length < 6) {
        status.textContent =
          "Password must be at least 6 characters.";
        return;
      }

      status.textContent = "Updating password...";

      const { error } = await asiSupabase.auth.updateUser({
        password: newPassword
      });

      if (error) {
        status.textContent = error.message;
        return;
      }

      await asiSupabase.auth.signOut();

      status.textContent =
        "Password updated successfully. Redirecting to login...";

      setTimeout(() => {
        window.location.href = "/";
      }, 2000);
    }
  </script>

</body>
</html>
