<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>Watch | ASI Network FRL</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Mux Player -->
<script
type="module"
src="https://cdn.jsdelivr.net/npm/@mux/mux-player/+esm"
></script>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background: #050505;
color: #ffffff;
font-family: Arial, Helvetica, sans-serif;
min-height: 100vh;
}

header {
background: #000000;
border-bottom: 1px solid #292929;
padding: 18px 5%;
display: flex;
justify-content: space-between;
align-items: center;
}

.logo {
font-size: 22px;
font-weight: 900;
letter-spacing: 1px;
}

.logo span {
color: #999999;
}

header a {
color: white;
text-decoration: none;
font-weight: bold;
font-size: 14px;
}

main {
width: min(1200px, 94%);
margin: 40px auto 70px;
}

.back-link {
color: #bdbdbd;
text-decoration: none;
display: inline-block;
margin-bottom: 25px;
font-size: 14px;
}

.eyebrow {
color: #9e9e9e;
font-size: 12px;
font-weight: bold;
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 10px;
}

h1 {
font-size: clamp(30px, 5vw, 58px);
line-height: 1.05;
margin-bottom: 15px;
}

#episodeDescription {
color: #bcbcbc;
line-height: 1.7;
margin-bottom: 30px;
max-width: 850px;
}

.player-wrap {
width: 100%;
background: #0d0d0d;
border: 1px solid #292929;
min-height: 320px;
}

mux-player {
width: 100%;
aspect-ratio: 16 / 9;
display: block;
}

#loading {
min-height: 420px;
display: flex;
justify-content: center;
align-items: center;
color: #aaaaaa;
text-align: center;
padding: 30px;
}

#errorBox {
display: none;
min-height: 420px;
padding: 40px 25px;
text-align: center;
align-items: center;
justify-content: center;
flex-direction: column;
}

#errorBox h2 {
margin-bottom: 12px;
}

#errorMessage {
color: #bdbdbd;
line-height: 1.6;
}

.subscribe-button {
display: inline-block;
margin-top: 25px;
background: white;
color: black;
padding: 14px 24px;
text-decoration: none;
font-weight: 900;
border-radius: 4px;
}
</style>
</head>

<body>

<header>

<div class="logo">
ASI NETWORK <span>FRL</span>
</div>

<a href="/members.html">
MEMBERS
</a>

</header>


<main>

<a
href="/members.html"
class="back-link"
>
← Back to Episodes
</a>

<div class="eyebrow">
ASI NETWORK FRL ORIGINAL
</div>

<h1 id="episodeTitle">
Loading Episode...
</h1>

<p id="episodeDescription">
Please wait while your episode loads.
</p>


<div class="player-wrap" id="playerWrap">

<div id="loading">
Checking your membership and loading your episode...
</div>

<div id="errorBox">

<h2>
We couldn't load this episode.
</h2>

<p id="errorMessage"></p>

<div id="subscribeArea"></div>

</div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";


/*
IMPORTANT:

Put the SAME Supabase publishable key
you already use on your ASI website here.

DO NOT use a service role key.
DO NOT send the key to me.
*/

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


const playerWrap =
document.getElementById("playerWrap");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const errorMessage =
document.getElementById("errorMessage");

const subscribeArea =
document.getElementById("subscribeArea");

const episodeTitle =
document.getElementById("episodeTitle");

const episodeDescription =
document.getElementById("episodeDescription");


function showError(
message,
showSubscribe = false
) {

loading.style.display =
"none";

errorBox.style.display =
"flex";

errorMessage.textContent =
message;

subscribeArea.innerHTML =
"";


if (showSubscribe) {

subscribeArea.innerHTML = `
<a
class="subscribe-button"
href="https://square.link/u/0l47AY8p"
>
SUBSCRIBE — $5.99/MONTH
</a>
`;

}

}


async function startEpisode() {

try {

/*
1. CHECK LOGIN
*/

const {
data: sessionData,
error: sessionError
} =
await supabaseClient.auth.getSession();


if (sessionError) {
throw sessionError;
}


const session =
sessionData.session;


if (!session) {

window.location.href =
"/login.html";

return;

}


/*
2. VERIFY ACTIVE SUBSCRIPTION
*/

const linkResponse =
await fetch(
`${SUPABASE_URL}/functions/v1/asi-link-subscription`,
{

method: "POST",

headers: {

"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_PUBLISHABLE_KEY,

"Content-Type":
"application/json"

}

}
);


const linkResult =
await linkResponse.json();


if (
!linkResponse.ok ||
!linkResult.active
) {

showError(
linkResult.error ||
"An active ASI Network FRL subscription is required.",
true
);

return;

}


/*
3. GET EPISODE NUMBER
*/

const params =
new URLSearchParams(
window.location.search
);


const episodeNumber =
Number(
params.get("episode")
);


if (!episodeNumber) {

throw new Error(
"Episode number is missing."
);

}


/*
4. LOAD EPISODE
*/

const {
data: episode,
error: episodeError
} =
await supabaseClient
.from("episodes")
.select(
"id,episode_number,title,description,is_published"
)
.eq(
"episode_number",
episodeNumber
)
.eq(
"is_published",
true
)
.maybeSingle();


if (episodeError) {
throw episodeError;
}


if (!episode) {

throw new Error(
"This episode is not available."
);

}


episodeTitle.textContent =
episode.title ||
`Episode ${episode.episode_number}`;


episodeDescription.textContent =
episode.description ||
"ASI Network FRL Original";


/*
5. GET SIGNED MUX TOKEN
*/

const tokenResponse =
await fetch(
`${SUPABASE_URL}/functions/v1/asi-mux-playback-token`,
{

method: "POST",

headers: {

"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_PUBLISHABLE_KEY,

"Content-Type":
"application/json"

},

body: JSON.stringify({

episodeId:
episode.id

})

}
);


const tokenResult =
await tokenResponse.json();


if (!tokenResponse.ok) {

throw new Error(
tokenResult.error ||
"Secure playback could not be authorized."
);

}


if (
!tokenResult.playbackId ||
!tokenResult.token
) {

throw new Error(
"Secure playback information is missing."
);

}


/*
6. IMPORTANT FIX

WAIT until BOTH values are ready.

THEN create the Mux player.

THEN attach playback-id AND
playback-token BEFORE the player
is added to the page.
*/

loading.style.display =
"none";


const muxPlayer =
document.createElement(
"mux-player"
);


muxPlayer.setAttribute(
"playback-id",
tokenResult.playbackId
);


muxPlayer.setAttribute(
"playback-token",
tokenResult.token
);


muxPlayer.setAttribute(
"controls",
""
);


muxPlayer.setAttribute(
"metadata-video-title",
episode.title ||
`Episode ${episode.episode_number}`
);


/*
Add player only AFTER
ID + token are attached.
*/

playerWrap.appendChild(
muxPlayer
);


} catch (error) {

console.error(error);

showError(
error?.message ||
"Something went wrong while loading this episode."
);

}

}


startEpisode();

</script>

</body>
</html>
