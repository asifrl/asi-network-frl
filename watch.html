<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Watch | ASI Network FRL</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Mux Player -->
<script
src="https://cdn.jsdelivr.net/npm/@mux/mux-player"
></script>

<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}

body {
background: #050505;
color: white;
font-family: Arial, Helvetica, sans-serif;
min-height: 100vh;
}

header {
background: #000;
border-bottom: 1px solid #292929;
padding: 18px 5%;
display: flex;
justify-content: space-between;
align-items: center;
gap: 20px;
}

.logo {
font-size: 22px;
font-weight: 900;
letter-spacing: 1px;
}

.logo span {
color: #a8a8a8;
}

header a {
color: white;
text-decoration: none;
font-size: 14px;
font-weight: bold;
}

main {
width: min(1200px, 94%);
margin: 40px auto 70px;
}

.back-link {
display: inline-block;
color: #bdbdbd;
text-decoration: none;
margin-bottom: 25px;
font-size: 14px;
}

.back-link:hover {
color: white;
}

.eyebrow {
color: #9e9e9e;
text-transform: uppercase;
letter-spacing: 2px;
font-size: 12px;
font-weight: bold;
margin-bottom: 10px;
}

h1 {
font-size: clamp(30px, 5vw, 58px);
line-height: 1.05;
margin-bottom: 15px;
}

#episodeDescription {
color: #bcbcbc;
line-height: 1.7;
max-width: 850px;
margin-bottom: 30px;
}

.player-wrap {
width: 100%;
background: #0d0d0d;
border: 1px solid #292929;
min-height: 300px;
display: flex;
align-items: center;
justify-content: center;
}

mux-player {
width: 100%;
aspect-ratio: 16 / 9;
--media-object-fit: contain;
}

#loading {
padding: 70px 20px;
text-align: center;
color: #aaa;
}

#errorBox {
display: none;
padding: 60px 25px;
text-align: center;
width: 100%;
}

#errorBox h2 {
margin-bottom: 10px;
font-size: 20px;
}

#errorMessage {
color: #bdbdbd;
line-height: 1.6;
}

.subscribe-button {
display: inline-block;
margin-top: 25px;
background: white;
color: black;
text-decoration: none;
padding: 14px 24px;
font-weight: 900;
border-radius: 4px;
}

@media (max-width: 700px) {
main {
margin-top: 25px;
}

header {
padding: 15px 4%;
}

.logo {
font-size: 18px;
}
}
</style>
</head>

<body>

<header>
<div class="logo">
ASI NETWORK <span>FRL</span>
</div>

<a href="/members.html">
MEMBERS
</a>
</header>

<main>

<a
href="/members.html"
class="back-link"
>
← Back to Episodes
</a>

<div class="eyebrow">
ASI NETWORK FRL ORIGINAL
</div>

<h1 id="episodeTitle">
Loading Episode...
</h1>

<p id="episodeDescription">
Please wait while your episode loads.
</p>

<div class="player-wrap">

<div id="loading">
Checking your membership and loading your episode...
</div>

<div id="errorBox">

<h2>
We couldn't load this episode.
</h2>

<p id="errorMessage"></p>

<div id="subscribeArea"></div>

</div>

<mux-player
id="player"
controls
style="display:none;"
></mux-player>

</div>

</main>


<script>
const SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";

/*
IMPORTANT:
Keep your EXISTING Supabase publishable key below.

If your current watch.html already contains your real
publishable key, paste that same publishable key here.

Do NOT use your secret/service-role key.
*/

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";


const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_PUBLISHABLE_KEY
);


const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const errorMessage =
document.getElementById("errorMessage");

const subscribeArea =
document.getElementById("subscribeArea");

const player =
document.getElementById("player");

const episodeTitle =
document.getElementById("episodeTitle");

const episodeDescription =
document.getElementById("episodeDescription");


function showError(
message,
showSubscribe = false
) {

loading.style.display = "none";
player.style.display = "none";

errorBox.style.display = "block";

errorMessage.textContent = message;

subscribeArea.innerHTML = "";

if (showSubscribe) {

subscribeArea.innerHTML = `
<a
class="subscribe-button"
href="https://square.link/u/0l47AY8p"
>
SUBSCRIBE — $5.99/MONTH
</a>
`;

}

}


async function startEpisode() {

try {

/*
GET CURRENT LOGIN SESSION
*/

const {
data: sessionData,
error: sessionError
} =
await supabaseClient.auth.getSession();


if (sessionError) {
throw sessionError;
}


const session =
sessionData.session;


if (!session) {

window.location.href =
"/login.html";

return;

}


/*
VERIFY / LINK SUBSCRIPTION
*/

const linkResponse =
await fetch(
`${SUPABASE_URL}/functions/v1/asi-link-subscription`,
{
method: "POST",

headers: {
"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_PUBLISHABLE_KEY,

"Content-Type":
"application/json"
}
}
);


const linkResult =
await linkResponse.json();


if (
!linkResponse.ok ||
!linkResult.active
) {

showError(
linkResult.error ||
"An active ASI Network FRL subscription is required to watch this episode.",
true
);

return;

}


/*
GET EPISODE NUMBER FROM URL

Example:
watch.html?episode=1
*/

const params =
new URLSearchParams(
window.location.search
);

const episodeNumber =
Number(
params.get("episode")
);


if (!episodeNumber) {

throw new Error(
"Episode number is missing."
);

}


/*
LOAD PUBLISHED EPISODE
*/

const {
data: episode,
error: episodeError
} =
await supabaseClient
.from("episodes")
.select(
"id, episode_number, title, description, video_id, is_published"
)
.eq(
"episode_number",
episodeNumber
)
.eq(
"is_published",
true
)
.maybeSingle();


if (episodeError) {
throw episodeError;
}


if (!episode) {

throw new Error(
"This episode is not available."
);

}


/*
SHOW EPISODE INFORMATION
*/

episodeTitle.textContent =
episode.title ||
`Episode ${episode.episode_number}`;


episodeDescription.textContent =
episode.description ||
"ASI Network FRL Original";


/*
ASK SECURE EDGE FUNCTION
FOR MUX PLAYBACK TOKEN
*/

const tokenResponse =
await fetch(
`${SUPABASE_URL}/functions/v1/asi-mux-playback-token`,
{
method: "POST",

headers: {
"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_PUBLISHABLE_KEY,

"Content-Type":
"application/json"
},

body: JSON.stringify({
episodeId: episode.id
})
}
);


const tokenResult =
await tokenResponse.json();


if (!tokenResponse.ok) {

throw new Error(
tokenResult.error ||
"Secure playback could not be authorized."
);

}


if (
!tokenResult.playbackId ||
!tokenResult.token
) {

throw new Error(
"Secure playback information is missing."
);

}


/*
IMPORTANT FIX:

Give Mux Player the EXACT playback ID
returned by our secure server.

Then give it the matching signed token.
*/

player.playbackId =
tokenResult.playbackId;

player.playbackToken =
tokenResult.token;


/*
SHOW PLAYER
*/

loading.style.display =
"none";

errorBox.style.display =
"none";

player.style.display =
"block";


} catch (error) {

console.error(error);

showError(
error?.message ||
"Something went wrong while loading this episode."
);

}

}


startEpisode();
</script>

</body>
</html>
