<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Watch | ASI Network FRL</title>

<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script
type="module"
src="https://cdn.jsdelivr.net/npm/@mux/mux-player/+esm"
></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
}

a{
color:inherit;
text-decoration:none;
}

button{
font:inherit;
cursor:pointer;
}

header{
position:sticky;
top:0;
z-index:100;
min-height:72px;
padding:0 4%;
display:flex;
align-items:center;
gap:26px;
background:rgba(0,0,0,.98);
border-bottom:1px solid #292929;
}

.logo{
font-weight:900;
letter-spacing:1px;
white-space:nowrap;
}

.logo span{
color:#999;
font-weight:500;
}

.nav{
display:flex;
gap:20px;
align-items:center;
flex:1;
}

.nav a{
font-size:12px;
font-weight:900;
white-space:nowrap;
}

.nav a:hover{
opacity:.7;
}

.right{
margin-left:auto;
position:relative;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:42px;
padding:0 18px;
border-radius:6px;
border:1px solid #444;
background:#111;
color:#fff;
font-size:12px;
font-weight:900;
}

.btn.primary{
background:#fff;
color:#000;
border-color:#fff;
}

.account-menu{
position:absolute;
right:0;
top:52px;
width:270px;
background:#101010;
border:1px solid #333;
border-radius:9px;
padding:8px;
display:none;
z-index:300;
box-shadow:0 22px 60px rgba(0,0,0,.6);
}

.account-menu.show{
display:block;
}

.account-email{
padding:13px;
color:#999;
font-size:12px;
border-bottom:1px solid #292929;
overflow-wrap:anywhere;
}

.menu-item{
display:block;
width:100%;
padding:13px;
border:0;
border-radius:5px;
background:transparent;
color:#fff;
text-align:left;
font-size:14px;
}

.menu-item:hover{
background:#1d1d1d;
}

#adminDashboardLink{
display:none;
}

main{
width:min(1200px,94%);
margin:40px auto 70px;
}

.back{
display:inline-block;
margin-bottom:28px;
color:#aaa;
font-size:13px;
}

.eyebrow{
color:#999;
font-size:12px;
font-weight:900;
letter-spacing:3px;
margin-bottom:10px;
}

h1{
font-size:clamp(34px,6vw,66px);
line-height:1;
margin:0 0 15px;
}

#episodeDescription{
max-width:850px;
color:#bbb;
line-height:1.7;
margin-bottom:28px;
}

.player{
background:#0c0c0c;
border:1px solid #292929;
border-radius:8px;
overflow:hidden;
min-height:360px;
}

mux-player{
width:100%;
aspect-ratio:16/9;
display:block;
}

#loading{
min-height:360px;
display:grid;
place-items:center;
padding:30px;
text-align:center;
color:#999;
font-weight:900;
letter-spacing:1px;
}

#errorBox{
display:none;
min-height:360px;
padding:45px 25px;
text-align:center;
align-items:center;
justify-content:center;
flex-direction:column;
}

#errorBox h2{
margin:0 0 12px;
}

#errorMessage{
max-width:650px;
margin:auto;
color:#aaa;
line-height:1.6;
}

#errorActions{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center;
}

.member-status{
margin-top:18px;
font-size:11px;
font-weight:900;
letter-spacing:1px;
color:#777;
}

.modal-backdrop{
position:fixed;
inset:0;
background:rgba(0,0,0,.82);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:1000;
}

.modal-backdrop.show{
display:flex;
}

.modal{
width:min(520px,100%);
background:#101010;
border:1px solid #333;
border-radius:10px;
padding:26px;
}

.modal h2{
margin:0 0 8px;
}

.modal p{
color:#999;
line-height:1.55;
}

.modal-row{
padding:14px 0;
border-bottom:1px solid #252525;
}

.modal-label{
font-size:11px;
font-weight:900;
color:#777;
text-transform:uppercase;
letter-spacing:.8px;
margin-bottom:5px;
}

.modal-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

#modalStatus{
display:none;
margin-top:15px;
padding:12px;
border:1px solid #333;
background:#181818;
border-radius:6px;
color:#ccc;
font-size:13px;
}

@media(max-width:760px){

header{
flex-wrap:wrap;
padding-top:14px;
padding-bottom:14px;
}

.nav{
order:3;
width:100%;
overflow-x:auto;
}

.account-menu{
right:0;
}

}

</style>
</head>

<body>

<header>

<a
class="logo"
href="/members.html"
>
ASI NETWORK <span>FRL</span> 👁️
</a>

<nav class="nav">

<a href="/members.html">
HOME
</a>

<a href="/shows.html">
SHOWS
</a>

<a href="/members.html#episodes">
EPISODES
</a>

</nav>

<div class="right">

<button
id="accountButton"
class="btn"
type="button"
>
ACCOUNT ▾
</button>

<div
id="accountMenu"
class="account-menu"
>

<div
id="accountEmail"
class="account-email"
>
Loading account...
</div>

<button
id="profileButton"
class="menu-item"
type="button"
>
My Profile
</button>

<button
id="settingsButton"
class="menu-item"
type="button"
>
Account Settings
</button>

<button
id="supportButton"
class="menu-item"
type="button"
>
Help & Support
</button>

<a
id="adminDashboardLink"
class="menu-item"
href="/admin.html"
>
Admin Dashboard
</a>

<button
id="logoutButton"
class="menu-item"
type="button"
>
Log Out
</button>

</div>

</div>

</header>

<main>

<a
class="back"
href="/members.html#episodes"
>
← Back to Episodes
</a>

<div class="eyebrow">
ASI NETWORK FRL ORIGINAL
</div>

<h1 id="episodeTitle">
Loading Episode...
</h1>

<p id="episodeDescription">
Checking your account and securely authorizing playback.
</p>

<div
id="playerWrap"
class="player"
>

<div id="loading">
VERIFYING ACCOUNT & SUBSCRIPTION...
</div>

<div id="errorBox">

<h2>
Unable to play this episode
</h2>

<p id="errorMessage"></p>

<div id="errorActions"></div>

</div>

</div>

<div
id="memberStatus"
class="member-status"
></div>

</main>

<div
id="modalBackdrop"
class="modal-backdrop"
>

<div class="modal">

<h2 id="modalTitle">
Account
</h2>

<div id="modalContent"></div>

<div
id="modalActions"
class="modal-actions"
></div>

<div id="modalStatus"></div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";

const SUPABASE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";

const SQUARE_CHECKOUT =
"https://square.link/u/0l47AY8p";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let currentSession = null;
let currentUser = null;
let isAdmin = false;

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("errorBox");

const errorMessage =
document.getElementById("errorMessage");

const errorActions =
document.getElementById("errorActions");

const playerWrap =
document.getElementById("playerWrap");

function showError(
message,
type = ""
){

loading.style.display =
"none";

errorBox.style.display =
"flex";

errorMessage.textContent =
message;

errorActions.innerHTML =
"";

if(type === "subscription"){

errorActions.innerHTML =
`
<a
class="btn primary"
href="${SQUARE_CHECKOUT}"
>
SUBSCRIBE • $5.99/MO
</a>

<a
class="btn"
href="/login.html"
>
SIGN IN
</a>
`;

}

if(type === "login"){

errorActions.innerHTML =
`
<a
class="btn primary"
href="/login.html"
>
MEMBER SIGN IN
</a>
`;

}

}

function closeMenu(){

document
.getElementById("accountMenu")
.classList.remove("show");

}

function openModal(
title,
content,
actions = []
){

closeMenu();

document
.getElementById("modalTitle")
.textContent =
title;

document
.getElementById("modalContent")
.innerHTML =
content;

const actionBox =
document.getElementById("modalActions");

actionBox.innerHTML =
"";

actions.forEach(
action => {

const el =
document.createElement(
action.href ? "a" : "button"
);

el.className =
action.primary
?
"btn primary"
:
"btn";

el.textContent =
action.label;

if(action.href){

el.href =
action.href;

}
else{

el.type =
"button";

el.addEventListener(
"click",
action.onClick
);

}

actionBox.appendChild(
el
);

}
);

const close =
document.createElement("button");

close.className =
"btn";

close.type =
"button";

close.textContent =
"CLOSE";

close.addEventListener(
"click",
closeModal
);

actionBox.appendChild(close);

document
.getElementById("modalStatus")
.style.display =
"none";

document
.getElementById("modalBackdrop")
.classList.add("show");

}

function closeModal(){

document
.getElementById("modalBackdrop")
.classList.remove("show");

}

function modalStatus(message){

const box =
document.getElementById("modalStatus");

box.style.display =
"block";

box.textContent =
message;

}

async function getAccount(){

const sessionResult =
await sb.auth.getSession();

currentSession =
sessionResult.data.session;

if(!currentSession){

window.location.replace(
"/login.html"
);

return false;

}

currentUser =
currentSession.user;

document
.getElementById("accountEmail")
.textContent =
currentUser.email || "";

const adminResult =
await sb
.from("admins")
.select("user_id")
.eq(
"user_id",
currentUser.id
)
.maybeSingle();

isAdmin =
!adminResult.error &&
!!adminResult.data;

document
.getElementById(
"adminDashboardLink"
)
.style.display =
isAdmin
?
"block"
:
"none";

return true;

}

async function verifyMembership(){

if(isAdmin){

document
.getElementById("memberStatus")
.textContent =
"ADMINISTRATOR ACCESS";

return true;

}

const membershipResponse =
await fetch(

`${SUPABASE_URL}/functions/v1/asi-link-subscription`,

{

method:"POST",

headers:{

"Authorization":
`Bearer ${currentSession.access_token}`,

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({})

}

);

let membership = {};

try{

membership =
await membershipResponse.json();

}
catch(error){}

const membershipStatus =
String(
membership.status || ""
).toUpperCase();

const active =
membershipResponse.ok &&
(
membership.active === true ||
membership.isActive === true ||
membershipStatus === "ACTIVE"
);

if(active){

document
.getElementById("memberStatus")
.textContent =
"ACTIVE ASI NETWORK FRL MEMBER";

}

return active;

}

async function loadEpisode(){

const params =
new URLSearchParams(
window.location.search
);

const episodeId =
params.get("id");

const episodeNumber =
Number(
params.get("episode")
);

let query =
sb
.from("episodes")
.select(
"id,season_id,episode_number,title,description,is_published"
)
.eq(
"is_published",
true
);

if(episodeId){

query =
query.eq(
"id",
episodeId
);

}
else if(episodeNumber){

query =
query.eq(
"episode_number",
episodeNumber
);

}
else{

throw new Error(
"Episode information is missing."
);

}

const episodeResult =
await query.maybeSingle();

if(episodeResult.error){

throw episodeResult.error;

}

if(!episodeResult.data){

throw new Error(
"This episode is not available."
);

}

return episodeResult.data;

}

function saveWatchHistory(
episode
){

let history = [];

try{

history =
JSON.parse(
localStorage.getItem(
"asi_watch_history"
) || "[]"
);

}
catch(error){}

history =
history.filter(
item =>
item.id !== episode.id
);

history.push({

id:
episode.id,

title:
episode.title ||
`Episode ${episode.episode_number}`,

episode:
episode.episode_number,

episodeId:
episode.id,

watchedAt:
Date.now()

});

localStorage.setItem(

"asi_watch_history",

JSON.stringify(
history.slice(-50)
)

);

}

async function initializePlayer(){

try{

const accountReady =
await getAccount();

if(!accountReady){

return;

}

const active =
await verifyMembership();

if(!active){

showError(

"Your ASI Network FRL account is signed in, but an active subscription could not be verified. Full episodes require an active $5.99/month subscription.",

"subscription"

);

return;

}

const episode =
await loadEpisode();

document
.getElementById("episodeTitle")
.textContent =
episode.title ||
`Episode ${episode.episode_number}`;

document
.getElementById("episodeDescription")
.textContent =
episode.description ||
"ASI Network FRL Original";

document.title =
`${episode.title || "Episode"} | ASI Network FRL`;

const tokenResponse =
await fetch(

`${SUPABASE_URL}/functions/v1/asi-mux-playback-token`,

{

method:"POST",

headers:{

"Authorization":
`Bearer ${currentSession.access_token}`,

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

episodeId:
episode.id

})

}

);

let tokenResult = {};

try{

tokenResult =
await tokenResponse.json();

}
catch(error){}

if(!tokenResponse.ok){

throw new Error(

tokenResult.error ||
"Secure playback could not be authorized."

);

}

if(
!tokenResult.playbackId ||
!tokenResult.token
){

throw new Error(
"Secure playback information is missing."
);

}

loading.style.display =
"none";

const player =
document.createElement(
"mux-player"
);

player.setAttribute(
"playback-id",
tokenResult.playbackId
);

player.setAttribute(
"playback-token",
tokenResult.token
);

player.setAttribute(
"controls",
""
);

player.setAttribute(
"metadata-video-title",
episode.title ||
`Episode ${episode.episode_number}`
);

playerWrap.appendChild(
player
);

saveWatchHistory(
episode
);

}catch(error){

console.error(
"Playback error:",
error
);

showError(
error?.message ||
"Something went wrong while loading this episode."
);

}

}

function openProfile(){

openModal(

"My Profile",

`
<div class="modal-row">

<div class="modal-label">
Email Address
</div>

<div>
${currentUser?.email || ""}
</div>

</div>

<div class="modal-row">

<div class="modal-label">
Account Access
</div>

<div>
${isAdmin
? "Administrator / Member"
: "Active Subscriber"}
</div>

</div>
`

);

}

function openSettings(){

openModal(

"Account Settings",

`
<div class="modal-row">

<div class="modal-label">
Signed In As
</div>

<div>
${currentUser?.email || ""}
</div>

</div>

<div class="modal-row">

<div class="modal-label">
Password
</div>

<div>
Send yourself a secure password-reset email if you want to change your password.
</div>

</div>
`,

[
{
label:
"SEND PASSWORD RESET EMAIL",

primary:true,

onClick:
sendPasswordReset
}
]

);

}

async function sendPasswordReset(){

if(
!currentUser ||
!currentUser.email
){

modalStatus(
"Unable to find your account email."
);

return;

}

modalStatus(
"Sending password reset email..."
);

const result =
await sb.auth.resetPasswordForEmail(

currentUser.email,

{

redirectTo:
window.location.origin +
"/reset.html"

}

);

if(result.error){

modalStatus(
result.error.message
);

return;

}

modalStatus(
"Reset email sent. Check your inbox and spam folder."
);

}

function openSupport(){

openModal(

"Help & Support",

`
<div class="modal-row">

<div class="modal-label">
Support Email
</div>

<div>
support@asinetworkfrl.com
</div>

</div>

<p>
Contact ASI Network FRL support for help with your account, subscription or playback.
</p>
`,

[
{
label:
"EMAIL SUPPORT",

primary:true,

href:
"mailto:support@asinetworkfrl.com?subject=ASI%20Network%20FRL%20Support"
}
]

);

}

document
.getElementById("accountButton")
.addEventListener(
"click",
function(event){

event.stopPropagation();

document
.getElementById("accountMenu")
.classList.toggle("show");

}
);

document
.addEventListener(
"click",
function(event){

const menu =
document.getElementById("accountMenu");

const button =
document.getElementById("accountButton");

if(
!menu.contains(event.target) &&
!button.contains(event.target)
){

menu.classList.remove("show");

}

}
);

document
.getElementById("profileButton")
.addEventListener(
"click",
openProfile
);

document
.getElementById("settingsButton")
.addEventListener(
"click",
openSettings
);

document
.getElementById("supportButton")
.addEventListener(
"click",
openSupport
);

document
.getElementById("logoutButton")
.addEventListener(
"click",
async function(){

await sb.auth.signOut();

window.location.replace(
"/"
);

}
);

document
.getElementById("modalBackdrop")
.addEventListener(
"click",
function(event){

if(event.target === this){

closeModal();

}

}
);

initializePlayer();

</script>

</body>
</html>
