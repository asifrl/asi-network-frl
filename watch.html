<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>
Watch | ASI Network FRL
</title>

<script
type="module"
src="https://cdn.jsdelivr.net/npm/@mux/mux-player"
></script>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

header{
height:70px;
padding:0 6%;
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #222;
background:#080808;
}

.logo{
font-weight:900;
letter-spacing:2px;
}

header a{
color:#aaa;
text-decoration:none;
font-size:12px;
font-weight:bold;
}

main{
max-width:1200px;
margin:auto;
padding:55px 6%;
}

.label{
font-size:11px;
letter-spacing:3px;
color:#888;
font-weight:900;
}

h1{
font-size:clamp(34px,5vw,64px);
margin:10px 0;
}

.description{
color:#aaa;
line-height:1.7;
max-width:800px;
margin-bottom:30px;
}

.player-wrap{
width:100%;
aspect-ratio:16/9;
background:#000;
border:1px solid #222;
display:flex;
align-items:center;
justify-content:center;
}

mux-player{
width:100%;
height:100%;
}

#status{
padding:30px;
text-align:center;
color:#aaa;
}

.error{
color:#fff;
}

.button{
display:inline-block;
margin-top:18px;
padding:13px 20px;
background:#fff;
color:#000;
text-decoration:none;
font-size:12px;
font-weight:900;
}

</style>

</head>

<body>

<header>

<div class="logo">
ASI NETWORK FRL
</div>

<a href="/">
← BACK TO NETWORK
</a>

</header>

<main>

<div class="label">
ASI NETWORK FRL ORIGINAL
</div>

<h1 id="episode-title">
Loading Episode...
</h1>

<p
id="episode-description"
class="description"
>
Verifying your membership and loading this episode.
</p>

<div class="player-wrap">

<div id="status">
Checking subscriber access...
</div>

<mux-player
id="asi-player"
controls
playsinline
style="display:none;"
>
</mux-player>

</div>

</main>

<script>

const ASI_SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";

const ASI_SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";

const asiSupabase =
supabase.createClient(
ASI_SUPABASE_URL,
ASI_SUPABASE_PUBLISHABLE_KEY
);

const LINK_SUBSCRIPTION_FUNCTION =
ASI_SUPABASE_URL +
"/functions/v1/asi-link-subscription";

const MUX_TOKEN_FUNCTION =
ASI_SUPABASE_URL +
"/functions/v1/asi-mux-playback-token";

async function loadEpisode(){

const status =
document.getElementById("status");

try{

/* CHECK LOGIN */

const {
data:{
session
}
} =
await asiSupabase.auth.getSession();

if(!session){

window.location.href =
"/login.html";

return;

}


/* CHECK ACTIVE SUBSCRIPTION */

const subscriptionResponse =
await fetch(
LINK_SUBSCRIPTION_FUNCTION,
{
method:"POST",

headers:{
"Authorization":
"Bearer " +
session.access_token,

"Content-Type":
"application/json"
}
}
);

const subscriptionResult =
await subscriptionResponse.json();

if(
!subscriptionResponse.ok ||
subscriptionResult.active !== true
){

status.innerHTML =
`
<div class="error">
An active ASI Network FRL subscription is required.
</div>

<a
class="button"
href="https://square.link/u/0l47AY8p"
>
SUBSCRIBE — $5.99/MONTH
</a>
`;

return;

}


/* GET EPISODE NUMBER FROM URL */

const params =
new URLSearchParams(
window.location.search
);

const episodeNumber =
Number(
params.get("episode") || "1"
);


/* FIND EPISODE */

const {
data:episode,
error:episodeError
} =
await asiSupabase
.from("episodes")
.select(
"id,title,description,video_id,episode_number,is_published"
)
.eq(
"episode_number",
episodeNumber
)
.maybeSingle();


if(episodeError){

throw episodeError;

}


if(!episode){

status.textContent =
"Episode not found.";

return;

}


document.getElementById(
"episode-title"
).textContent =
episode.title ||
"ASI Network FRL Episode";


document.getElementById(
"episode-description"
).textContent =
episode.description ||
"";


/*
We will keep Episode 1 unpublished
until the secure playback system
is completely tested.

For now, owner testing is allowed.
*/


/* REQUEST SHORT-LIVED MUX TOKEN */

const tokenResponse =
await fetch(
MUX_TOKEN_FUNCTION,
{
method:"POST",

headers:{
"Authorization":
"Bearer " +
session.access_token,

"Content-Type":
"application/json"
},

body:JSON.stringify({
episode_id:
episode.id
})
}
);


const tokenResult =
await tokenResponse.json();


if(!tokenResponse.ok){

throw new Error(
tokenResult.error ||
"Could not authorize video playback."
);

}


if(
!tokenResult.playback_id ||
!tokenResult.token
){

throw new Error(
"Playback authorization is incomplete."
);

}


/* LOAD SIGNED MUX VIDEO */

const player =
document.getElementById(
"asi-player"
);


player.setAttribute(
"playback-id",
tokenResult.playback_id
);


player.setAttribute(
"playback-token",
tokenResult.token
);


if(tokenResult.thumbnail_token){

player.setAttribute(
"thumbnail-token",
tokenResult.thumbnail_token
);

}


status.style.display =
"none";

player.style.display =
"block";


}catch(error){

console.error(error);

status.innerHTML =
`
<div class="error">
We couldn't load this episode.
</div>

<br>

${error.message}
`;

}

}

window.addEventListener(
"DOMContentLoaded",
loadEpisode
);

</script>

</body>

</html>
