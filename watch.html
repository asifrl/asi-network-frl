<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Watch | ASI Network FRL</title>

<meta name="robots" content="noindex,nofollow">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script
type="module"
src="https://cdn.jsdelivr.net/npm/@mux/mux-player/+esm"
></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
min-height:100vh;
}

a{
color:inherit;
text-decoration:none;
}

header{
min-height:72px;
padding:0 4%;
display:flex;
align-items:center;
gap:25px;
background:#000;
border-bottom:1px solid #292929;
}

.logo{
font-weight:900;
letter-spacing:1px;
}

.logo span{
color:#999;
font-weight:500;
}

.nav{
display:flex;
gap:20px;
align-items:center;
}

.nav a{
font-size:12px;
font-weight:900;
}

main{
width:min(1200px,94%);
margin:40px auto 70px;
}

.back{
display:inline-block;
margin-bottom:28px;
color:#aaa;
font-size:13px;
}

.eyebrow{
color:#999;
font-size:12px;
font-weight:900;
letter-spacing:3px;
margin-bottom:10px;
}

h1{
font-size:clamp(34px,6vw,66px);
line-height:1;
margin:0 0 15px;
}

#episodeDescription{
max-width:850px;
color:#bbb;
line-height:1.7;
margin-bottom:28px;
}

.player{
background:#0c0c0c;
border:1px solid #292929;
min-height:360px;
}

mux-player{
width:100%;
aspect-ratio:16/9;
display:block;
}

#loading{
min-height:360px;
display:grid;
place-items:center;
padding:30px;
text-align:center;
color:#999;
font-weight:900;
letter-spacing:1px;
}

#errorBox{
display:none;
min-height:360px;
padding:45px 25px;
text-align:center;
align-items:center;
justify-content:center;
flex-direction:column;
}

#errorBox h2{
margin:0 0 12px;
}

#errorMessage{
max-width:650px;
margin:auto;
color:#aaa;
line-height:1.6;
}

.btn{
display:inline-flex;
align-items:center;
justify-content:center;
min-height:44px;
padding:0 18px;
border-radius:6px;
border:1px solid #444;
background:#111;
color:#fff;
font-size:12px;
font-weight:900;
margin-top:20px;
}

.btn.primary{
background:#fff;
color:#000;
border-color:#fff;
}

</style>
</head>


<body>

<header>

<a
class="logo"
href="/members.html"
>
ASI NETWORK <span>FRL</span>
</a>

<nav class="nav">

<a href="/members.html">
HOME
</a>

<a href="/shows.html">
SHOWS
</a>

</nav>

</header>


<main>

<a
class="back"
href="/members.html#episodes"
>
← Back to Episodes
</a>


<div class="eyebrow">
ASI NETWORK FRL ORIGINAL
</div>


<h1 id="episodeTitle">
Loading Episode...
</h1>


<p id="episodeDescription">
Checking your membership and loading secure playback.
</p>


<div
id="playerWrap"
class="player"
>

<div id="loading">
VERIFYING SUBSCRIPTION...
</div>


<div id="errorBox">

<h2>
Unable to play this episode
</h2>

<p id="errorMessage"></p>

<div id="errorActions"></div>

</div>

</div>

</main>


<script>

const SUPABASE_URL =
"https://gvvtwwrjfscaunczptpv.supabase.co";


const SUPABASE_KEY =
"sb_publishable_iliNeR5tX_4X4KAh5ZjPpA_e6ueLnP-";


const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const playerWrap =
document.getElementById(
"playerWrap"
);


const loading =
document.getElementById(
"loading"
);


const errorBox =
document.getElementById(
"errorBox"
);


const errorMessage =
document.getElementById(
"errorMessage"
);


const errorActions =
document.getElementById(
"errorActions"
);


function showError(
message,
showSubscribe = false
){

loading.style.display =
"none";


errorBox.style.display =
"flex";


errorMessage.textContent =
message;


errorActions.innerHTML =
"";


if(showSubscribe){

errorActions.innerHTML =
`
<a
class="btn primary"
href="/create-account.html"
>
SUBSCRIBE — $5.99/MONTH
</a>
`;

}

}


function saveWatchHistory(
episode
){

let history = [];


try{

history =
JSON.parse(
localStorage.getItem(
"asi_watch_history"
) || "[]"
);

}
catch(error){}


history =
history.filter(
item =>
item.id !== episode.id
);


history.push({

id:
episode.id,

title:
episode.title ||
`Episode ${episode.episode_number}`,

episode:
episode.episode_number,

watchedAt:
Date.now()

});


localStorage.setItem(

"asi_watch_history",

JSON.stringify(
history.slice(-50)
)

);

}


async function initializePlayer(){

try{


/* =========================
1. REQUIRE LOGIN
========================= */

const sessionResult =
await sb.auth.getSession();


const session =
sessionResult.data.session;


if(!session){

window.location.replace(
"/login.html"
);

return;

}


/* =========================
2. CHECK ADMIN STATUS
========================= */

const adminResult =
await sb
.from("admins")
.select("user_id")
.eq(
"user_id",
session.user.id
)
.maybeSingle();


const isAdmin =
!adminResult.error &&
!!adminResult.data;


/* =========================
3. VERIFY PAID SUBSCRIPTION
========================= */

if(!isAdmin){

const membershipResponse =
await fetch(

`${SUPABASE_URL}/functions/v1/asi-link-subscription`,

{

method:"POST",

headers:{

"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({})

}

);


let membership = {};


try{

membership =
await membershipResponse.json();

}
catch(error){}


const membershipStatus =
String(
membership.status || ""
).toUpperCase();


const active =
membershipResponse.ok &&
(
membership.active === true ||
membership.isActive === true ||
membershipStatus === "ACTIVE"
);


if(!active){

showError(
"An active ASI Network FRL subscription is required to watch full episodes.",
true
);

return;

}

}


/* =========================
4. READ EPISODE NUMBER
========================= */

const params =
new URLSearchParams(
window.location.search
);


const episodeNumber =
Number(
params.get("episode")
);


if(!episodeNumber){

throw new Error(
"Episode number is missing."
);

}


/* =========================
5. LOAD PUBLISHED EPISODE
========================= */

const episodeResult =
await sb
.from("episodes")
.select(
"id,episode_number,title,description,is_published"
)
.eq(
"episode_number",
episodeNumber
)
.eq(
"is_published",
true
)
.maybeSingle();


if(episodeResult.error){

throw episodeResult.error;

}


if(!episodeResult.data){

throw new Error(
"This episode is not available."
);

}


const episode =
episodeResult.data;


document
.getElementById(
"episodeTitle"
)
.textContent =
episode.title ||
`Episode ${episode.episode_number}`;


document
.getElementById(
"episodeDescription"
)
.textContent =
episode.description ||
"ASI Network FRL Original";


/* =========================
6. REQUEST SIGNED MUX TOKEN
========================= */

const tokenResponse =
await fetch(

`${SUPABASE_URL}/functions/v1/asi-mux-playback-token`,

{

method:"POST",

headers:{

"Authorization":
`Bearer ${session.access_token}`,

"apikey":
SUPABASE_KEY,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

episodeId:
episode.id

})

}

);


let tokenResult = {};


try{

tokenResult =
await tokenResponse.json();

}
catch(error){}


if(!tokenResponse.ok){

throw new Error(
tokenResult.error ||
"Secure playback could not be authorized."
);

}


if(
!tokenResult.playbackId ||
!tokenResult.token
){

throw new Error(
"Secure playback information is missing."
);

}


/* =========================
7. BUILD PLAYER ONLY AFTER
AUTHORIZATION IS COMPLETE
========================= */

loading.style.display =
"none";


const player =
document.createElement(
"mux-player"
);


player.setAttribute(
"playback-id",
tokenResult.playbackId
);


player.setAttribute(
"playback-token",
tokenResult.token
);


player.setAttribute(
"controls",
""
);


player.setAttribute(
"metadata-video-title",
episode.title ||
`Episode ${episode.episode_number}`
);


playerWrap.appendChild(
player
);


/* SAVE WATCH HISTORY */

saveWatchHistory(
episode
);


}catch(error){

console.error(
"Playback error:",
error
);


showError(
error?.message ||
"Something went wrong while loading this episode."
);

}

}


initializePlayer();

</script>

</body>
</html>
